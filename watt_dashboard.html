<title>Dashboard +Watt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette matches the Mentor internal dashboard standard (see Natui / PromoPharma
     Amazon performance dashboards) so this report sits in the same visual family. */
  :root{
    color-scheme: light;
    --page:#f7f6f3;
    --surface:#ffffff;
    --surface-2:#f3f3f3;
    --border:#e8e6e1;
    --border-strong:#dcd9d2;
    --ink:#1a1a1a;
    --ink-2:#434343;
    --ink-3:#6b6a67;
    --grid:#efece6;
    --axis:#dcd9d2;
    --header-ink:#232f3e;

    --brand:#ff7237;
    --brand-soft:#fff1e9;
    --brand-ink:#c85a29;

    --good:#2d9f6e;
    --good-soft:#edfbf4;
    --critical:#e05252;
    --critical-soft:#fef2f2;
    --neutral-soft:#f3f3f3;

    --s1:#ff7237; --s2:#3a6ea5; --s3:#2d9f6e; --s4:#d99a2b;
    --s5:#b5576f; --s6:#7b5ea7; --s7:#232f3e; --s8:#948f86;

    --font-display:"Poppins", system-ui, sans-serif;
    --font-body:"Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:"Poppins", system-ui, sans-serif;
    --font-code:ui-monospace, "SF Mono", Menlo, monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--brand-soft); color:var(--brand-ink);}

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px; flex:none; background:var(--surface);
    border-right:1px solid var(--border);
    position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .brand{
    display:flex; flex-direction:column; gap:2px;
    background:var(--header-ink); padding:18px 18px 16px;
  }
  .brand .mark{ font-family:var(--font-display); font-weight:700; font-size:17px; color:#fff; letter-spacing:-.01em; }
  .brand .mark span{ color:var(--brand); }
  .brand .client{ font-family:var(--font-display); font-weight:600; font-size:13px; color:#fff; opacity:.92; }
  .brand .sub{ font-size:9.5px; color:#aab0bb; text-transform:uppercase; letter-spacing:.1em; margin-top:1px; }

  .nav-scroll{ padding:14px 14px 24px; flex:1; }

  .nav-group-label{
    font-family:var(--font-display); font-weight:600;
    font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
    padding:14px 10px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:9px;
    padding:8px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; font-weight:500; color:var(--ink-2);
    text-decoration:none; border-left:2px solid transparent; margin-left:-2px;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--brand-soft); color:var(--brand-ink); font-weight:600; border-left-color:var(--brand); }
  .nav-item .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .nav-item .ic{ width:16px; height:16px; flex:none; opacity:.85; }
  .nav-item .cnt{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-3); }
  .nav-item.active .cnt{ color:var(--brand-ink); }
  .nav-item.nav-highlight:not(.active){ color:var(--brand-ink); }
  .nav-item.nav-highlight:not(.active) .ic{ opacity:1; }
  .nav-item.nav-highlight:not(.active)::after{ content:''; width:6px; height:6px; border-radius:50%; background:var(--brand); margin-left:auto; flex:none; }

  .sidebar-foot{ padding:14px 10px 4px; font-size:11px; color:var(--ink-3); border-top:1px solid var(--border); margin-top:16px; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:30px 34px 60px; max-width:1180px; }
  .topbar{ display:none; }

  .crumb{ font-size:12px; color:var(--ink-3); margin-bottom:8px; }
  .crumb a{ color:var(--ink-2); text-decoration:none; }
  .crumb a:hover{ text-decoration:underline; }

  h1.page-title{
    font-family:var(--font-display); font-weight:700; font-size:34px;
    margin:0 0 4px; letter-spacing:.01em; text-wrap:balance;
  }
  .page-sub{ color:var(--ink-2); font-size:13.5px; margin:0 0 18px; max-width:70ch; }

  /* ---------- Filter bar ---------- */
  .filterbar{
    display:flex; align-items:center; flex-wrap:wrap; gap:16px 22px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 16px; margin-bottom:22px;
  }
  .filter-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .filter-label{
    font-family:var(--font-display); font-weight:600; font-size:10px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.08em; margin-right:2px;
  }
  .filter-presets{ display:flex; gap:5px; }
  .preset-btn{
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink-2);
    font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer;
    font-family:var(--font-display);
  }
  .preset-btn:hover{ background:var(--border); }
  .preset-btn.active{ background:var(--header-ink); color:#fff; border-color:var(--header-ink); }
  select.fsel{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:500; padding:5px 8px; border-radius:7px; font-family:var(--font-body);
    cursor:pointer;
  }
  .filter-arrow{ color:var(--ink-3); font-size:12px; }
  .filter-summary{ margin-left:auto; font-size:11.5px; color:var(--ink-3); }
  .filter-summary b{ color:var(--ink-2); }

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px 16px 14px; position:relative; overflow:hidden; min-width:0;
  }
  .kpi::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--kpi-accent, var(--header-ink)); }
  .kpi .lbl{
    font-family:var(--font-display); font-weight:500; font-size:10px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:9px;
  }
  .kpi .val{ font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1; letter-spacing:-.01em; }
  .kpi .delta{ margin-top:9px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .kpi .delta .dtag{ font-size:10px; color:var(--ink-3); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px 22px 16px; margin-bottom:18px;
  }
  .card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:2px; flex-wrap:wrap;}
  .card-title{ font-family:var(--font-display); font-weight:600; font-size:15px; }
  .card-note{ font-size:11.5px; color:var(--ink-3); }

  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600;
    padding:3px 8px; border-radius:999px; font-family:var(--font-mono);
  }
  .badge.up{ color:var(--good); background:var(--good-soft); }
  .badge.down{ color:var(--critical); background:var(--critical-soft); }
  .badge.flat{ color:var(--ink-3); background:var(--neutral-soft); }
  .badge .arrow{ font-size:10px; }

  .status-pill{
    display:inline-block; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .status-pill.cat{ background:var(--good-soft); color:var(--good); }
  .status-pill.eol{ background:var(--critical-soft); color:var(--critical); }
  .status-pill.other{ background:var(--neutral-soft); color:var(--ink-3); }

  .line-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    text-decoration:none; padding:3px 9px 3px 7px; border-radius:999px; background:var(--surface-2);
  }
  .line-badge .dot{ width:8px; height:8px; border-radius:50%; }
  .line-badge:hover{ background:var(--border); }

  .grid-2{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
  .grid-2 > .card{ margin-bottom:0; min-width:0; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-3); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  thead th:hover{ color:var(--ink); }
  thead th.num, td.num{ text-align:right; }
  thead th .sort-ic{ font-size:9px; margin-left:3px; opacity:.6; }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr.rowlink{ cursor:pointer; }
  tbody tr.rowlink:hover td{ background:var(--surface-2); }
  td.num, .tabular{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  td.prod-name{ max-width:320px; }
  td.prod-name .t{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
  td.prod-name .asin{ font-family:var(--font-code); font-size:10.5px; color:var(--ink-3); }
  .table-wrap{ overflow-x:auto; }
  .spark-cell{ width:84px; }

  .two-col-list{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .two-col-list > .card{ min-width:0; }
  .mover-list{ display:flex; flex-direction:column; min-width:0; }
  .mover-item{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);
    text-decoration:none; color:inherit; cursor:pointer; min-width:0;
  }
  .mover-item:last-child{ border-bottom:none; }
  .mover-item:hover .t{ text-decoration:underline; }
  .mover-item .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:500; }
  .mover-item .ln{ font-size:11px; color:var(--ink-3); }

  .callout{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:14px 18px; font-size:12.5px; color:var(--ink-2); margin-top:4px;
  }
  .callout b{ color:var(--ink); }
  .callout ul{ margin:6px 0 0; padding-left:18px; }
  .callout li{ margin:3px 0; }

  .chart-wrap{ width:100%; }
  .chart-wrap svg{ display:block; width:100%; height:auto; overflow:visible; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin:2px 0 10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); }
  .legend-item .sw{ width:10px; height:10px; border-radius:2px; }
  .legend-item .ln{ width:14px; height:2px; border-radius:2px; }

  .tooltip{
    position:absolute; pointer-events:none; background:var(--header-ink); color:#ffffff;
    font-size:11.5px; padding:7px 10px; border-radius:8px; z-index:20;
    box-shadow:0 6px 20px rgba(0,0,0,.25); white-space:nowrap; opacity:0; transition:opacity .08s;
  }
  .tooltip .tt-row{ display:flex; align-items:center; gap:6px; }
  .tooltip .tt-key{ width:9px; height:2px; border-radius:2px; flex:none; }
  .tooltip .tt-val{ font-weight:700; font-family:var(--font-mono); margin-left:auto; padding-left:10px; }
  .tooltip .tt-date{ font-weight:600; margin-bottom:3px; opacity:.75; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }

  .line-header{ display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap; }
  .line-dot-lg{ width:15px; height:15px; border-radius:5px; flex:none; }
  .back-link{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2); text-decoration:none; margin-bottom:10px; }
  .back-link:hover{ color:var(--ink); text-decoration:underline; }

  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:7px 11px; margin-bottom:14px; max-width:340px;
  }
  .search-box input{
    border:none; outline:none; background:transparent; font-size:13px; width:100%; color:var(--ink); font-family:var(--font-body);
  }
  .search-box svg{ flex:none; opacity:.5; }

  .empty{ padding:30px 10px; text-align:center; color:var(--ink-3); font-size:13px; }

  /* ---------- Funnel visual ---------- */
  .funnel-viz{ display:flex; flex-direction:column; gap:10px; margin:6px 0 4px; }
  .funnel-row{ display:flex; align-items:center; gap:14px; }
  .funnel-row .fr-label{ width:132px; flex:none; font-size:12.5px; font-weight:600; color:var(--ink-2); }
  .funnel-row .fr-track{ flex:1; background:var(--surface-2); border-radius:8px; height:34px; position:relative; display:flex; align-items:center; }
  .funnel-row .fr-fill{ height:100%; border-radius:8px; display:flex; align-items:center; padding:0 12px; box-sizing:border-box; }
  .funnel-row .fr-fill span{ font-family:var(--font-mono); font-weight:700; font-size:13px; color:#fff; white-space:nowrap; }
  .funnel-row .fr-fill.outside span{ color:var(--ink); margin-left:8px; }
  .funnel-row .fr-pct{ width:60px; flex:none; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-3); }

  /* ---------- Opportunita ---------- */
  .opp-banner{
    display:flex; align-items:center; gap:16px; background:var(--header-ink); border-radius:12px;
    padding:16px 20px; margin-bottom:22px; text-decoration:none; color:#fff;
  }
  .opp-banner .opp-ic{
    width:38px; height:38px; border-radius:10px; background:var(--brand); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .opp-banner .opp-ic svg{ width:20px; height:20px; }
  .opp-banner .opp-txt{ flex:1; min-width:0; }
  .opp-banner .opp-eyebrow{ font-family:var(--font-display); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--brand); margin-bottom:2px; }
  .opp-banner .opp-title{ font-family:var(--font-display); font-weight:600; font-size:14px; }
  .opp-banner .opp-sub{ font-size:12px; color:#c7ccd6; margin-top:1px; }
  .opp-banner .opp-cta{ flex:none; font-family:var(--font-display); font-weight:600; font-size:12.5px; color:#fff; display:flex; align-items:center; gap:4px; }
  .opp-banner:hover{ background:#1a2432; }

  .opp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
  .opp-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; min-width:0; }
  .opp-card-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .opp-card-head .opp-tag{ font-family:var(--font-display); font-weight:700; font-size:13.5px; }
  .opp-card.gem .opp-tag{ color:var(--good); }
  .opp-card.laggard .opp-tag{ color:var(--critical); }
  .opp-card-desc{ font-size:12px; color:var(--ink-2); margin-bottom:12px; line-height:1.5; }
  .opp-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .opp-row:last-child{ border-bottom:none; }
  .opp-row .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px; font-weight:500; }
  .opp-row .metrics{ flex:none; display:flex; gap:8px; font-family:var(--font-mono); font-size:11.5px; }
  .opp-row .metrics .m-good{ color:var(--good); font-weight:700; }
  .opp-row .metrics .m-bad{ color:var(--critical); font-weight:700; }
  .opp-alert{
    display:flex; align-items:flex-start; gap:12px; background:var(--critical-soft); border:1px solid #f5c9c9;
    border-radius:12px; padding:14px 18px; margin-bottom:18px; font-size:12.5px; color:var(--ink-2);
  }
  .opp-alert b{ color:var(--critical); }

  /* ---------- Glossary ---------- */
  .gloss-cat{ font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--brand-ink); text-transform:uppercase; letter-spacing:.06em; margin:22px 0 4px; }
  .gloss-cat:first-child{ margin-top:0; }
  .gloss-item{ padding:11px 0; border-bottom:1px solid var(--border); }
  .gloss-item:last-child{ border-bottom:none; }
  .gloss-term{ font-family:var(--font-display); font-weight:600; font-size:13.5px; margin-bottom:3px; }
  .gloss-def{ font-size:12.5px; color:var(--ink-2); line-height:1.55; }

  /* mobile */
  .mobile-nav-toggle{ display:none; }
  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ position:static; width:auto; height:auto; border-right:none; border-bottom:1px solid var(--border); }
    .brand{ flex-direction:row; align-items:center; justify-content:space-between; }
    .brand-text{ display:flex; flex-direction:column; gap:2px; }
    .mobile-nav-toggle{
      display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
      border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:6px 11px; background:rgba(255,255,255,.08);
      cursor:pointer; color:#fff; font-family:var(--font-display);
    }
    .sidebar .nav-scroll{ display:none; }
    .sidebar.open .nav-scroll{ display:block; }
    .main{ padding:20px 16px 50px; }
    .kpi-row{ grid-template-columns:1fr 1fr; }
    .grid-2{ grid-template-columns:1fr; }
    .two-col-list{ grid-template-columns:1fr; }
    .opp-grid{ grid-template-columns:1fr; }
    .opp-banner{ flex-wrap:wrap; }
    h1.page-title{ font-size:26px; }
    .filter-summary{ margin-left:0; width:100%; }
    .funnel-row .fr-label{ width:92px; font-size:11px; }
  }
</style>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-text">
        <div class="mark">mentor<span>.</span></div>
        <div class="client">+Watt &mdash; Radar Linee</div>
        <div class="sub">Dashboard vendite Amazon.it</div>
      </div>
      <button class="mobile-nav-toggle" id="navToggle">Menu &#9662;</button>
    </div>
    <div class="nav-scroll">
      <div id="navRoot"></div>
      <div class="sidebar-foot">Vendite: Ott 2024 &ndash; Ago 2026 (completo)<br>Ricerca Amazon: Gen 2025 &ndash; Ago 2026<br>Brand Noviqa escluso</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
var D = window.REPORT_DATA;
var MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
var MESI_LONG = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

var LINE_ORDER = ['POWER','ADVANCE CARE','ENDURANCE','ADVANCE','WELLNESS','QUALITY FOOD','VEGETAL','ALTRO'];
var SLOT_VAR = {1:'--s1',2:'--s2',3:'--s3',4:'--s4',5:'--s5',6:'--s6',7:'--s7',8:'--s8'};

function css(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
function lineColor(code){ var L = D.lines[code]; return L ? css(SLOT_VAR[L.slot]) : css('--ink-3'); }

function ymLabel(ym){ var p = ym.split('-'); return MESI[parseInt(p[1],10)-1] + ' ' + p[0].slice(2); }
function ymLabelFull(ym){ var p = ym.split('-'); return MESI[parseInt(p[1],10)-1] + ' ' + p[0]; }
function fmtInt(n){ return Math.round(n||0).toLocaleString('it-IT'); }
function fmtEUR(n){ return Math.round(n||0).toLocaleString('it-IT') + ' &euro;'; }
function fmtPct1(n){ return (n>=0?'+':'') + n.toFixed(1) + '%'; }
function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function deltaPct(curr, base){
  if (base > 0) return (curr-base)/base*100;
  if (curr > 0) return Infinity;
  return 0;
}
function deltaBadge(curr, base){
  var pct = deltaPct(curr, base);
  var cls = 'flat', arrow = '&ndash;', txt;
  if (pct === Infinity){ cls='up'; arrow='&#9650;'; txt = 'nuovo'; }
  else if (base===0 && curr===0){ cls='flat'; arrow=''; txt='n/d'; }
  else {
    cls = pct > 0.5 ? 'up' : (pct < -0.5 ? 'down' : 'flat');
    arrow = pct > 0.5 ? '&#9650;' : (pct < -0.5 ? '&#9660;' : '&ndash;');
    txt = fmtPct1(pct);
  }
  return '<span class="badge '+cls+'"><span class="arrow">'+arrow+'</span>'+txt+'</span>';
}
function naBadge(){ return '<span class="badge flat"><span class="arrow"></span>n/d</span>'; }

/* ---------------- month-range helpers ---------------- */
function ymParts(ym){ return {y:+ym.slice(0,4), m:+ym.slice(5,7)}; }
function shiftYm(ym, delta){
  var o = ymParts(ym); var total = o.y*12+(o.m-1)+delta;
  var y = Math.floor(total/12), m = (total%12+12)%12+1;
  return y+'-'+(m<10?'0':'')+m;
}
function monthsBetween(from,to){
  var a=ymParts(from), b=ymParts(to);
  return (b.y*12+b.m)-(a.y*12+a.m)+1;
}
function fullMonthRange(startYm, endYm){
  var out = []; var cur = startYm;
  while (cur <= endYm){ out.push(cur); cur = shiftYm(cur,1); }
  return out;
}

function rangeHas(universe, from, to){ return universe.indexOf(from)>=0 && universe.indexOf(to)>=0; }

function pickComparison(from, to, universe){
  var n = monthsBetween(from,to);
  var yoyFrom=shiftYm(from,-12), yoyTo=shiftYm(to,-12);
  var seqFrom=shiftYm(from,-n), seqTo=shiftYm(from,-1);
  if (rangeHas(universe, yoyFrom, yoyTo)) return {mode:'yoy', from:yoyFrom, to:yoyTo};
  if (rangeHas(universe, seqFrom, seqTo)) return {mode:'seq', from:seqFrom, to:seqTo};
  return null;
}
function cmpLabel(cmp){ return cmp.mode==='yoy' ? 'YoY' : 'vs periodo prec.'; }

function productAgg(p, from, to){
  var ordini=0, ripetuti=0;
  p.months.forEach(function(m){ if (m.ym>=from && m.ym<=to){ ordini+=m.ordini; ripetuti+=m.ripetuti; } });
  return {ordini:ordini, ripetuti:ripetuti};
}
function lineAgg(code, from, to){
  var ordini=0, ripetuti=0;
  (D.lines[code]?D.lines[code].asins:[]).forEach(function(a){
    var r = productAgg(D.products[a], from, to); ordini+=r.ordini; ripetuti+=r.ripetuti;
  });
  return {ordini:ordini, ripetuti:ripetuti};
}
function productSeries(p, months){

function funnelAgg(asinFilter, from, to){
  var agg = {impressioni:0, clic:0, carrello:0, acquisti:0, fatturato:0, prezzoSum:0, prezzoN:0, ratingSum:0, ratingN:0};
  var keys = asinFilter ? asinFilter : Object.keys(D.funnel);
  keys.forEach(function(a){
    var fp = D.funnel[a]; if (!fp) return;
    fp.months.forEach(function(m){
      if (m.ym<from || m.ym>to) return;
      agg.impressioni+=m.impressioni; agg.clic+=m.clic; agg.carrello+=m.carrello;
      agg.acquisti+=m.acquisti; agg.fatturato+=m.fatturato;
      if (m.prezzo){ agg.prezzoSum+=m.prezzo; agg.prezzoN++; }
      if (m.rating){ agg.ratingSum+=m.rating; agg.ratingN++; }
    });
  });
  agg.ctr = agg.impressioni>0 ? agg.clic/agg.impressioni*100 : 0;
  agg.conversione = agg.clic>0 ? agg.acquisti/agg.clic*100 : 0;
  agg.prezzoMed = agg.prezzoN>0 ? agg.prezzoSum/agg.prezzoN : 0;
  agg.ratingMed = agg.ratingN>0 ? agg.ratingSum/agg.ratingN : 0;
  return agg;
}
function funnelProdAgg(fp, from, to){
  var agg = {impressioni:0, clic:0, carrello:0, acquisti:0, fatturato:0};
  fp.months.forEach(function(m){
    if (m.ym<from || m.ym>to) return;
    agg.impressioni+=m.impressioni; agg.clic+=m.clic; agg.carrello+=m.carrello; agg.acquisti+=m.acquisti; agg.fatturato+=m.fatturato;
  });
  agg.ctr = agg.impressioni>0 ? agg.clic/agg.impressioni*100 : 0;
  agg.conversione = agg.clic>0 ? agg.acquisti/agg.clic*100 : 0;
  return agg;
}

function parseHash(){
  var h = location.hash.replace(/^#\/?/,'');
  var parts = h.split('/').filter(Boolean);
  if (parts.length===0) return {view:'home'};
  if (parts[0]==='store') return {view:'store'};
  if (parts[0]==='ricerca' && parts[1]==='prodotti') return {view:'ricercaProdotti'};
  if (parts[0]==='ricerca') return {view:'ricerca'};
  if (parts[0]==='opportunita') return {view:'opportunita'};
  if (parts[0]==='glossario') return {view:'glossario'};

  if (parts[0]==='prodotto') return {view:'prodotto', asin: decodeURIComponent(parts[1]||'')};
  return {view:'home'};
}

/* ================= CHARTS ================= */
var TT = document.getElementById('tooltip');
function hideTT(){ TT.style.opacity = 0; }
function showTT(x, y, html, containerRect){
  TT.innerHTML = html;
  var left = containerRect.left + x + window.scrollX + 14;
  var top = containerRect.top + y + window.scrollY - 10;
  var maxLeft = window.scrollX + document.documentElement.clientWidth - 240;
  if (left > maxLeft) left = containerRect.left + x + window.scrollX - TT.offsetWidth - 14;
  TT.style.left = left+'px'; TT.style.top = top+'px'; TT.style.opacity = 1;
}

function niceStep(maxVal){
  if (maxVal<=0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(maxVal)));
  var res = maxVal/mag;
  var step;
  if (res<=1) step=0.2; else if(res<=2) step=0.5; else if(res<=5) step=1; else step=2;
  return step*mag;
}
function niceMax(maxVal){
  if (maxVal<=0) return 10;
  var step = niceStep(maxVal);
  return Math.ceil(maxVal/step)*step;
}

/* Bar chart: monthly, 1 or 2 stacked series. series = [{name,color,values:[...]}] aligned to xYms */
function barChartMonthly(container, xYms, series, opts){
  opts = opts || {};
  var W = container.clientWidth || 600, H = opts.height || 230;
  var padL = 40, padR = 10, padT = 14, padB = 26;
  var plotW = W-padL-padR, plotH = H-padT-padB;
  var n = xYms.length;
  var totals = xYms.map(function(ym,i){
    return series.reduce(function(s,ser){ return s + (ser.values[i]||0); },0);
  });
  var maxV = niceMax(Math.max.apply(null, totals.concat([1])));
  var gap = 3;
  var bw = Math.min(24, plotW/n - gap);
  if (bw < 2) bw = 2;
  var step = plotW/n;

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  var ticks = 4;
  for (var t=0;t<=ticks;t++){
    var v = maxV/ticks*t;
    var y = padT + plotH - (v/maxV)*plotH;
    svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--font-mono)">'+fmtCompact(v)+'</text>';
  }
  var labelEvery = n>20?3:(n>12?2:1);
  var showIdx = [];
  for (var i=0;i<n;i++){ if (i%labelEvery===0) showIdx.push(i); }
  if (showIdx[showIdx.length-1] !== n-1){
    if (n-1-showIdx[showIdx.length-1] < Math.max(1,labelEvery-1)) showIdx[showIdx.length-1] = n-1;
    else showIdx.push(n-1);
  }
  showIdx.forEach(function(i){
    var lx = padL + step*i + step/2;
    svg += '<text x="'+lx+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">'+ymLabel(xYms[i])+'</text>';
  });
  for (i=0;i<n;i++){
    var bx = padL + step*i + (step-bw)/2;
    var yCursor = padT+plotH;
    series.forEach(function(ser, si){
      var v = ser.values[i]||0;
      var h = (v/maxV)*plotH;
      if (h<0) h=0;
      var yTop = yCursor - h;
      var rTop = (si===series.length-1) ? 3 : 0;
      if (h>0.5){
        svg += '<path data-i="'+i+'" class="bar-hit" d="'+roundedTopRect(bx,yTop,bw,h,Math.min(rTop,bw/2))+'" fill="'+ser.color+'"/>';
      }
      yCursor -= h;
    });
  }
  for (i=0;i<n;i++){
    var hx = padL + step*i;
    svg += '<rect class="hit-col" data-i="'+i+'" x="'+hx+'" y="'+padT+'" width="'+step+'" height="'+plotH+'" fill="transparent"/>';
  }
  svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+plotH)+'" y2="'+(padT+plotH)+'" stroke="var(--axis)" stroke-width="1"/>';
  svg += '</svg>';
  container.innerHTML = svg;

  var svgEl = container.querySelector('svg');
  svgEl.addEventListener('pointermove', function(e){
    var rect = svgEl.getBoundingClientRect();
    var scaleX = W/rect.width;
    var xIn = (e.clientX-rect.left)*scaleX;
    var idx = Math.round((xIn-padL-step/2)/step);
    if (idx<0) idx=0; if (idx>n-1) idx=n-1;
    var ym = xYms[idx];
    var rows = '';
    series.forEach(function(ser){
      var v = ser.values[idx]||0;
      rows += '<div class="tt-row"><span class="tt-key" style="background:'+ser.color+'"></span><span>'+esc(ser.name)+'</span><span class="tt-val">'+(opts.pct?fmtPct1(v):fmtInt(v))+'</span></div>';
    });
    if (series.length>1){
      var tot = series.reduce(function(s,ser){return s+(ser.values[idx]||0);},0);
      rows += '<div class="tt-row" style="border-top:1px solid rgba(128,128,128,.25);margin-top:4px;padding-top:4px;"><span>Totale</span><span class="tt-val">'+fmtInt(tot)+'</span></div>';
    }
    var cRect = container.getBoundingClientRect();
    showTT((idx*step+step/2)/scaleX, (padT)/scaleX, '<div class="tt-date">'+ymLabelFull(ym)+'</div>'+rows, cRect);
  });
  svgEl.addEventListener('pointerleave', hideTT);
}
function roundedTopRect(x,y,w,h,r){
  if (r<=0) return 'M'+x+','+(y+h)+' h'+w+' v-'+h+' h-'+w+' z';
  return 'M'+x+','+(y+h)+
    ' V'+(y+r)+
    ' Q'+x+','+y+' '+(x+r)+','+y+
    ' H'+(x+w-r)+
    ' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+
    ' V'+(y+h)+' Z';
}
function fmtCompact(v){
  if (v>=1000000) return (v/1000000).toFixed(v%1000000===0?0:1)+'M';
  if (v>=1000) return (v/1000).toFixed(v%1000===0?0:0)+'k';
  return Math.round(v).toString();
}

/* Line+area chart: series=[{name,color,values:[...] , area:bool}] aligned to xYms */
function lineAreaChart(container, xYms, series, opts){
  opts = opts || {};
  var W = container.clientWidth || 600, H = opts.height || 230;
  var padL = 44, padR = 10, padT = 14, padB = 26;
  var plotW = W-padL-padR, plotH = H-padT-padB;
  var n = xYms.length;
  var allVals = [];
  series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) allVals.push(v); }); });
  var maxV = niceMax(Math.max.apply(null, allVals.concat([1])));
  var minV = opts.zeroBase===false ? Math.min.apply(null, allVals.concat([0])) : 0;
  var step = n>1 ? plotW/(n-1) : plotW;

  function xAt(i){ return padL + step*i; }
  function yAt(v){ return padT + plotH - ((v-minV)/(maxV-minV))*plotH; }

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  var ticks = 4;
  for (var t=0;t<=ticks;t++){
    var v = minV + (maxV-minV)/ticks*t;
    var y = yAt(v);
    svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--font-mono)">'+(opts.pct?v.toFixed(0)+'%':fmtCompact(v))+'</text>';
  }
  var labelEvery = n>20?3:(n>12?2:1);
  var showIdx2 = [];
  for (var i=0;i<n;i++){ if (i%labelEvery===0) showIdx2.push(i); }
  if (showIdx2[showIdx2.length-1] !== n-1){
    if (n-1-showIdx2[showIdx2.length-1] < Math.max(1,labelEvery-1)) showIdx2[showIdx2.length-1] = n-1;
    else showIdx2.push(n-1);
  }
  showIdx2.forEach(function(i){
    svg += '<text x="'+xAt(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">'+ymLabel(xYms[i])+'</text>';
  });
  if (opts.band){
    var bx1 = xAt(opts.band[0]), bx2 = xAt(opts.band[1]);
    svg += '<rect x="'+bx1+'" y="'+padT+'" width="'+(bx2-bx1)+'" height="'+plotH+'" fill="var(--brand)" opacity="0.07"/>';
  }

  series.forEach(function(ser){
    var pts = [];
    for (i=0;i<n;i++){ var v = ser.values[i]; if (v==null){continue;} pts.push([xAt(i), yAt(v), i]); }
    if (pts.length===0) return;
    var d = 'M'+pts.map(function(p){return p[0]+','+p[1];}).join(' L');
    if (ser.area){
      var areaD = d + ' L'+pts[pts.length-1][0]+','+(padT+plotH)+' L'+pts[0][0]+','+(padT+plotH)+' Z';
      svg += '<path d="'+areaD+'" fill="'+ser.color+'" opacity="0.10"/>';
    }
    svg += '<path d="'+d+'" fill="none" stroke="'+ser.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var last = pts[pts.length-1];
    svg += '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" fill="'+ser.color+'" stroke="var(--surface)" stroke-width="2"/>';
  });

  svg += '<line class="cursor" x1="0" x2="0" y1="'+padT+'" y2="'+(padT+plotH)+'" stroke="var(--ink-3)" stroke-width="1" opacity="0" />';
  svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+plotH)+'" y2="'+(padT+plotH)+'" stroke="var(--axis)" stroke-width="1"/>';
  svg += '</svg>';
  container.innerHTML = svg;

  var svgEl = container.querySelector('svg');
  var cursor = svgEl.querySelector('.cursor');
  svgEl.addEventListener('pointermove', function(e){
    var rect = svgEl.getBoundingClientRect();
    var scaleX = W/rect.width;
    var xIn = (e.clientX-rect.left)*scaleX;
    var idx = Math.round((xIn-padL)/step);
    if (idx<0) idx=0; if (idx>n-1) idx=n-1;
    var ym = xYms[idx];
    cursor.setAttribute('x1', xAt(idx)); cursor.setAttribute('x2', xAt(idx));
    cursor.setAttribute('opacity', 1);
    var rows = '';
    series.forEach(function(ser){
      var v = ser.values[idx];
      rows += '<div class="tt-row"><span class="tt-key" style="background:'+ser.color+'"></span><span>'+esc(ser.name)+'</span><span class="tt-val">'+(v==null?'n/d':(opts.pct?fmtPct1(v):(opts.eur?fmtEUR(v):fmtInt(v))))+'</span></div>';
    });
    var cRect = container.getBoundingClientRect();
    showTT(xAt(idx)/scaleX, padT/scaleX, '<div class="tt-date">'+ymLabelFull(ym)+'</div>'+rows, cRect);
  });
  svgEl.addEventListener('pointerleave', function(){ cursor.setAttribute('opacity',0); hideTT(); });
}

function sparkline(values, color, w, h){
  w = w||72; h = h||24;
  var max = Math.max.apply(null, values.concat([1]));
  var min = 0;
  var n = values.length;
  if (n<2) return '<svg width="'+w+'" height="'+h+'"></svg>';
  var pts = values.map(function(v,i){
    var x = i/(n-1)*(w-4)+2;
    var y = h-2-((v-min)/(max-min||1))*(h-4);
    return x+','+y;
  });
  var d = 'M'+pts.join(' L');
  var lastXY = pts[pts.length-1].split(',');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lastXY[0]+'" cy="'+lastXY[1]+'" r="2" fill="'+color+'"/></svg>';
}

  html += '<div class="filter-summary">Periodo selezionato: <b>'+periodLabel(FILTERS.from,FILTERS.to)+'</b> ('+monthsBetween(FILTERS.from,FILTERS.to)+' '+(monthsBetween(FILTERS.from,FILTERS.to)===1?'mese':'mesi')+')</div>';

function presetBtn(key,label){ return '<button class="preset-btn" data-preset="'+key+'">'+label+'</button>'; }
function applyPreset(p){
  if (p==='3'){ FILTERS.to=LAST_MONTH; FILTERS.from=shiftYm(LAST_MONTH,-2); }
  else if (p==='6'){ FILTERS.to=LAST_MONTH; FILTERS.from=shiftYm(LAST_MONTH,-5); }
  else if (p==='12'){ FILTERS.to=LAST_MONTH; FILTERS.from=shiftYm(LAST_MONTH,-11); }
  else if (p==='ytd'){ FILTERS.to=LAST_MONTH; FILTERS.from=LAST_MONTH.slice(0,4)+'-01'; }
  else if (p==='q'){
    var mo=+LAST_MONTH.slice(5,7), y=LAST_MONTH.slice(0,4);
    var qStart = Math.floor((mo-1)/3)*3+1;
    FILTERS.from = y+'-'+(qStart<10?'0':'')+qStart; FILTERS.to = LAST_MONTH;
  }
}
function bindFilterBar(){
  var ff = document.getElementById('filterFrom'), ft = document.getElementById('filterTo');
  if (ff) ff.addEventListener('change', function(e){ FILTERS.from=e.target.value; if(FILTERS.from>FILTERS.to) FILTERS.to=FILTERS.from; renderMain(); });
  if (ft) ft.addEventListener('change', function(e){ FILTERS.to=e.target.value; if(FILTERS.to<FILTERS.from) FILTERS.from=FILTERS.to; renderMain(); });
  var fl = document.getElementById('filterLinea');
  if (fl) fl.addEventListener('change', function(e){ FILTERS.linea=e.target.value; renderMain(); });
  document.querySelectorAll('.preset-btn').forEach(function(b){
    b.addEventListener('click', function(){ applyPreset(b.getAttribute('data-preset')); renderMain(); });
  });
}

  barChartMonthly(document.getElementById('chartLine'), monthsAll, [{name:L.label, color: color, values: monthVals}], {height:220});

  var asinProducts = L.asins.map(function(a){ return D.products[a]; });
  var sortState = {key:'periodA', dir:-1};
  var filterText = '';

    var filtered = asinProducts.filter(function(p){
      if (!filterText) return true;
      return p.titolo.toLowerCase().indexOf(filterText)>=0 || p.asin.toLowerCase().indexOf(filterText)>=0;
    });
    var withAgg = filtered.map(function(p){ return {p:p, A:productAgg(p,from,to), C:cmp?productAgg(p,cmp.from,cmp.to):{ordini:0}}; });
    var sorted = withAgg.slice().sort(function(a,b){
      var av,bv;
      if (sortState.key==='titolo'){ return sortState.dir*a.p.titolo.localeCompare(b.p.titolo); }
      if (sortState.key==='status'){ return sortState.dir*(a.p.status||'').localeCompare(b.p.status||''); }
      if (sortState.key==='periodA'){ av=a.A.ordini; bv=b.A.ordini; }
      else { av=deltaPct(a.A.ordini,a.C.ordini); bv=deltaPct(b.A.ordini,b.C.ordini); if(av===Infinity)av=99999; if(bv===Infinity)bv=99999; }
      return sortState.dir*(av-bv);

    if (sorted.length===0){
      document.querySelector('#prodTable tbody').innerHTML = '<tr><td colspan="5"><div class="empty">Nessun prodotto trovato</div></td></tr>';

        '</tr>';
    }).join('');

  renderRows();
  document.querySelectorAll('#prodTable thead th').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.getAttribute('data-k');
      sortState.dir = (sortState.key===k) ? -sortState.dir : -1;
      sortState.key = k;
      renderRows();
    });
  });
  document.getElementById('prodSearch').addEventListener('input', function(e){
    filterText = e.target.value.toLowerCase();
    renderRows();
  });
}

function funnelRow(label, value, base, color){
  var pct = base>0 ? value/base*100 : 0;
  var widthPct = Math.max(3, pct);
  var outside = widthPct < 16;
  var fillStyle = 'width:'+widthPct+'%;background:'+color+';'+(outside?'padding:0;':'');
  var innerSpan = outside ? '' : '<span>'+fmtInt(value)+'</span>';
  var outsideSpan = outside ? '<span style="color:var(--ink);margin-left:10px;font-family:var(--font-mono);font-weight:700;font-size:13px;white-space:nowrap;">'+fmtInt(value)+'</span>' : '';
  return '<div class="funnel-row"><span class="fr-label">'+esc(label)+'</span><div class="fr-track"><div class="fr-fill" style="'+fillStyle+'">'+innerSpan+'</div>'+outsideSpan+'</div><span class="fr-pct">'+pct.toFixed(1)+'%</span></div>';
}

/* ---------------- Opportunita ---------------- */
function computeOpportunities(scopedKeys, from, to){
  var MIN_IMPR = 1500;
  var rows = scopedKeys.map(function(a){ return {fp:D.funnel[a], agg:funnelProdAgg(D.funnel[a], from, to)}; })
    .filter(function(x){ return x.agg.impressioni >= MIN_IMPR; });
  if (!rows.length) return null;
  var totClic = rows.reduce(function(s,x){return s+x.agg.clic;},0);
  var totAcq = rows.reduce(function(s,x){return s+x.agg.acquisti;},0);
  var avgConv = totClic>0 ? totAcq/totClic*100 : 0;
  var ctrs = rows.map(function(x){return x.agg.ctr;}).sort(function(a,b){return a-b;});
  var medianCTR = ctrs[Math.floor(ctrs.length/2)];
  var imprs = rows.map(function(x){return x.agg.impressioni;}).sort(function(a,b){return a-b;});
  var p70Impr = imprs[Math.floor(imprs.length*0.7)];

  var gems = rows.filter(function(x){ return x.agg.ctr <= medianCTR*0.75 && x.agg.conversione >= avgConv*1.3 && x.agg.acquisti>=3; })
    .sort(function(a,b){ return b.agg.conversione-a.agg.conversione; }).slice(0,5);
  var laggards = rows.filter(function(x){ return x.agg.impressioni >= p70Impr && x.agg.conversione <= avgConv*0.6; })
    .sort(function(a,b){ return b.agg.impressioni-a.agg.impressioni; }).slice(0,5);

  return {avgConv:avgConv, medianCTR:medianCTR, gems:gems, laggards:laggards, n:rows.length};
}
function oppBannerHtml(opp){
  if (!opp || (!opp.gems.length && !opp.laggards.length)) return '';
  var parts = [];
  if (opp.gems.length) parts.push(opp.gems.length+' prodott'+(opp.gems.length>1?'i':'o')+' con alto potenziale ads');
  if (opp.laggards.length) parts.push(opp.laggards.length+' con conversione sotto media');
  return '<a class="opp-banner" href="#/opportunita">'+
    '<span class="opp-ic">'+iconBoltWhite()+'</span>'+
    '<span class="opp-txt"><div class="opp-eyebrow">Opportunit&agrave; rilevate</div>'+
    '<div class="opp-title">'+esc(parts.join(' &middot; '))+'</div>'+
    '<div class="opp-sub">Analisi del funnel di ricerca nel periodo selezionato</div></span>'+
    '<span class="opp-cta">Vedi dettaglio &rarr;</span>'+
    '</a>';
}
function iconBoltWhite(){ return '<svg viewBox="0 0 16 16" fill="none"><path d="M8.6 1.5 3 9h4l-.6 5.5L13 7H9l-.4-5.5Z" fill="#fff"/></svg>'; }

function renderOpportunita(){
  var from=FILTERS.from, to=FILTERS.to;
  var funnelFrom = from < FUNNEL_MONTHS[0] ? FUNNEL_MONTHS[0] : from;
  var hasData = funnelFrom<=to;

  var html = '';
  html += '<h1 class="page-title">Opportunit&agrave;</h1>';
  html += '<p class="page-sub">Lettura incrociata del funnel di ricerca Amazon per individuare due segnali azionabili: prodotti che convertono bene ma sono poco visti (candidati a pi&ugrave; investimento ads) e prodotti molto visti che convertono poco (da verificare su prezzo, scheda o recensioni prima di investire).</p>';
  html += filterBarHtml(true);

  if (!hasData){
    html += '<div class="empty">Nessun dato disponibile per il periodo selezionato.</div>';
    document.getElementById('main').innerHTML = html;
    bindFilterBar();
    return;
  }

  var asinFilter = lineaAsinSet(FILTERS.linea);
  var scopedKeys = asinFilter ? asinFilter.filter(function(a){return D.funnel[a];}) : Object.keys(D.funnel);
  var opp = computeOpportunities(scopedKeys, funnelFrom, to);

  if (!opp){
    html += '<div class="empty">Traffico insufficiente nel periodo/linea selezionati per un&apos;analisi affidabile.</div>';
    document.getElementById('main').innerHTML = html;
    bindFilterBar();
    return;
  }

  var cmp = pickComparison(from, to, FUNNEL_MONTHS);
  if (cmp){
    var curImpr = funnelAgg(scopedKeys, funnelFrom, to).impressioni;
    var prevFrom2 = cmp.from < FUNNEL_MONTHS[0] ? FUNNEL_MONTHS[0] : cmp.from;
    var prevImpr = funnelAgg(scopedKeys, prevFrom2, cmp.to).impressioni;
    var imprDelta = deltaPct(curImpr, prevImpr);
    if (imprDelta !== Infinity && imprDelta <= -12){
      html += '<div class="opp-alert"><span>&#9888;&#65039;</span><span><b>Calo di visibilit&agrave;:</b> le impressioni da ricerca sono scese del '+Math.abs(imprDelta).toFixed(0)+'% rispetto al periodo precedente ('+cmpLabel(cmp)+'). Se non corrisponde a un calo di stagionalit&agrave; nota, vale la pena controllare ranking organico e budget ads attivo.</span></div>';
    }
  }

  html += '<div class="opp-grid">';
  html += '<div class="opp-card gem">';
  html += '<div class="opp-card-head"><span class="opp-tag">Alto potenziale ads</span></div>';
  html += '<div class="opp-card-desc">CTR sotto la mediana ma conversione ben oltre la media store ('+opp.avgConv.toFixed(1)+'%): chi li trova li compra, mancano solo le impressioni. Prime candidate per aumentare budget Sponsored Products.</div>';
  if (opp.gems.length){
    html += opp.gems.map(function(x){
      var fp=x.fp, a=x.agg;
      var lc = D.lines[fp.linea] ? lineColor(fp.linea) : css('--ink-3');
      return '<div class="opp-row rowlink" data-href="#/prodotto/'+encodeURIComponent(fp.asin)+'">'+
        '<span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+lc+';flex:none;"></span>'+
        '<span class="t">'+esc(fp.titolo)+'</span>'+
        '<span class="metrics"><span>CTR '+a.ctr.toFixed(2)+'%</span><span class="m-good">conv '+a.conversione.toFixed(1)+'%</span></span>'+
        '</div>';
    }).join('');
  } else { html += '<div class="empty">Nessun prodotto qualificato nel periodo</div>'; }
  html += '</div>';

  html += '<div class="opp-card laggard">';
  html += '<div class="opp-card-head"><span class="opp-tag">Da verificare</span></div>';
  html += '<div class="opp-card-desc">Tra i pi&ugrave; visti in ricerca, ma convertono molto sotto la media store. Prima di spingere altro traffico/ads, controllare prezzo, Buy Box, recensioni o disponibilit&agrave;.</div>';
  if (opp.laggards.length){
    html += opp.laggards.map(function(x){
      var fp=x.fp, a=x.agg;
      var lc = D.lines[fp.linea] ? lineColor(fp.linea) : css('--ink-3');
      return '<div class="opp-row rowlink" data-href="#/prodotto/'+encodeURIComponent(fp.asin)+'">'+
        '<span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+lc+';flex:none;"></span>'+
        '<span class="t">'+esc(fp.titolo)+'</span>'+
        '<span class="metrics"><span>'+fmtCompact(a.impressioni)+' impr.</span><span class="m-bad">conv '+a.conversione.toFixed(1)+'%</span></span>'+
        '</div>';
    }).join('');
  } else { html += '<div class="empty">Nessun prodotto qualificato nel periodo</div>'; }
  html += '</div>';
  html += '</div>';

  html += '<div class="callout"><b>Come leggere questi dati</b><ul>'+
    '<li>Soglia minima 1.500 impressioni nel periodo per essere considerati (evita falsi segnali su prodotti con poco traffico).</li>'+
    '<li>"Alto potenziale ads": CTR sotto il 75% della mediana e conversione almeno 1,3x la media store.</li>'+
    '<li>"Da verificare": impressioni nel 30% pi&ugrave; alto e conversione sotto il 60% della media store.</li>'+
    '<li>Il funnel di ricerca somma impression organiche e sponsorizzate: non isola la spesa ads. Per ACOS e performance per keyword serve il report Sponsored Products/Search Term.</li>'+
    '</ul></div>';

  document.getElementById('main').innerHTML = html;
  bindFilterBar();
  bindRowLinks();
}

/* ---------------- Glossario ---------------- */
function renderGlossario(){
  var html = '';
  html += '<h1 class="page-title">Glossario metriche</h1>';
  html += '<p class="page-sub">Definizioni ufficiali Amazon Brand Analytics per le metriche usate nelle sezioni <a href="#/ricerca">Ricerca Amazon</a> e negli ordini ripetuti. Fonte: glossario Amazon Brand Analytics.</p>';

  html += '<div class="card">';
  var byCat = {};
  D.glossary.forEach(function(g){ (byCat[g.cat] = byCat[g.cat]||[]).push(g); });
  Object.keys(byCat).forEach(function(cat){
    html += '<div class="gloss-cat">'+esc(cat)+'</div>';
    byCat[cat].forEach(function(g){
      html += '<div class="gloss-item"><div class="gloss-term">'+esc(g.term)+'</div><div class="gloss-def">'+esc(g.def)+'</div></div>';
    });
  });
  html += '</div>';

  document.getElementById('main').innerHTML = html;
}

/* ---------------- router ---------------- */
function renderMain(){
  var route = CURRENT_ROUTE;
  if (route.view==='home') renderHome();
  else if (route.view==='store') renderStore();
  else if (route.view==='ricerca') renderRicerca();
  else if (route.view==='opportunita') renderOpportunita();
  else if (route.view==='ricercaProdotti') renderRicercaProdotti();
  else if (route.view==='glossario') renderGlossario();
  else if (route.view==='linea') renderLinea(route.code);
  else if (route.view==='prodotto') renderProdotto(route.asin);
}
function render(){
  CURRENT_ROUTE = parseHash();
  renderNav(CURRENT_ROUTE);
  renderMain();
  window.scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
}
window.addEventListener('hashchange', render);
window.addEventListener('resize', debounce(function(){ renderMain(); }, 200));
function debounce(fn, ms){ var t; return function(){ clearTimeout(t); t=setTimeout(fn, ms); }; }

document.getElementById('navToggle').addEventListener('click', function(){
  document.getElementById('sidebar').classList.toggle('open');
});

render();
})();
</script>
